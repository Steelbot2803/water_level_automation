<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Neptune</title>
		<link rel="icon" href="%sveltekit.assets%/img/neptune_icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a7bff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Neptune" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/img/neptune_icon.png" />

		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme_preference');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (stored === 'dark' || (!stored && prefersDark)) {
						document.documentElement.classList.add('dark');
					}
				} catch (_) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
