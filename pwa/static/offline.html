<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline | Water Level Automation</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					'Inter',
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					sans-serif;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				background: #f5f8ff;
				color: #1f2937;
				padding: 1.5rem;
			}
			main {
				max-width: 28rem;
				background: rgba(255, 255, 255, 0.88);
				border: 1px solid rgba(15, 23, 42, 0.08);
				border-radius: 1rem;
				padding: 1.25rem 1rem;
				box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.15rem;
			}
			p {
				margin: 0;
				line-height: 1.45;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #020617;
					color: #e2e8f0;
				}
				main {
					background: rgba(15, 23, 42, 0.82);
					border-color: rgba(148, 163, 184, 0.25);
					box-shadow: 0 12px 36px rgba(2, 6, 23, 0.45);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You’re offline</h1>
			<p>
				Water Level Automation couldn’t reach the network. Reconnect to continue, then refresh this
				page.
			</p>
		</main>
	</body>
</html>
